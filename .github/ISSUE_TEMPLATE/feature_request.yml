name: Feature request
description: Suggest an improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe the situation, not only the solution.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would you like to see?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
  - type: checkboxes
    id: constraints
    attributes:
      label: Project constraints
      description: LiteDisplay has no networking, no telemetry, no third-party dependencies and no persistent privileged helper.
      options:
        - label: This request fits within those constraints
