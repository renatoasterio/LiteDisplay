<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 440" width="1280" height="440" role="img" aria-labelledby="t d">
  <title id="t">LiteDisplay</title>
  <desc id="d">LiteDisplay: sharp text on Full HD monitors connected to Apple Silicon Macs. Illustration comparing 1x rendering with 2x HiDPI rendering.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d0b1f"/>
      <stop offset="1" stop-color="#17112e"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#40d1ff"/>
      <stop offset="0.45" stop-color="#7a78ff"/>
      <stop offset="0.75" stop-color="#b873ff"/>
      <stop offset="1" stop-color="#ff73b8"/>
    </linearGradient>
    <radialGradient id="glowA" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#5856f5" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#5856f5" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#f54d9e" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#f54d9e" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowC" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#14b8ed" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#14b8ed" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-5%" y="-20%" width="110%" height="140%">
      <feGaussianBlur stdDeviation="1.5"/>
    </filter>
    <clipPath id="round"><rect width="1280" height="440" rx="28"/></clipPath>
  </defs>

  <g clip-path="url(#round)">
    <rect width="1280" height="440" fill="url(#bg)"/>
    <ellipse cx="170" cy="60" rx="420" ry="300" fill="url(#glowA)"/>
    <ellipse cx="1180" cy="420" rx="420" ry="300" fill="url(#glowB)"/>
    <ellipse cx="900" cy="20" rx="320" ry="200" fill="url(#glowC)"/>

    <!-- Logo: monitor with a sparkle -->
    <g transform="translate(84 92)">
      <rect x="0" y="0" width="112" height="70" rx="14" fill="#7a78ff" fill-opacity="0.22" stroke="url(#brand)" stroke-width="5"/>
      <path d="M56 14 L61 30 L77 35 L61 40 L56 56 L51 40 L35 35 L51 30 Z" fill="url(#brand)"/>
      <path d="M82 12 L84 19 L91 21 L84 23 L82 30 L80 23 L73 21 L80 19 Z" fill="#40d1ff"/>
      <rect x="49" y="76" width="14" height="13" rx="3" fill="url(#brand)"/>
      <rect x="28" y="94" width="56" height="8" rx="4" fill="url(#brand)"/>
    </g>

    <text x="226" y="150" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="72" font-weight="800" fill="#ffffff" letter-spacing="-2">LiteDisplay</text>
    <text x="230" y="192" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="25" font-weight="500" fill="#c9c6ee">Sharp text on Full HD monitors. Built for Apple Silicon Macs.</text>

    <!-- 1x card -->
    <g transform="translate(84 250)">
      <rect width="530" height="140" rx="20" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.12"/>
      <rect x="22" y="20" width="118" height="28" rx="14" fill="#ff9f0a" fill-opacity="0.18"/>
      <text x="81" y="39" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#ffb340">1x · STANDARD</text>
      <text x="24" y="104" filter="url(#soft)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="40" font-weight="600" fill="#e6e4f5" fill-opacity="0.85">The quick brown fox</text>
      <text x="506" y="40" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#9c99c2">1920 × 1080 px</text>
    </g>

    <!-- arrow -->
    <g transform="translate(640 320)" fill="none" stroke="url(#brand)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
      <path d="M-14 0 H14"/>
      <path d="M5 -9 L14 0 L5 9"/>
    </g>

    <!-- 2x card -->
    <g transform="translate(666 250)">
      <rect width="530" height="140" rx="20" fill="#ffffff" fill-opacity="0.07" stroke="url(#brand)" stroke-width="2"/>
      <rect x="22" y="20" width="96" height="28" rx="14" fill="#30d158" fill-opacity="0.18"/>
      <text x="70" y="39" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#4ade80">2x · HiDPI</text>
      <text x="24" y="104" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="40" font-weight="600" fill="#ffffff">The quick brown fox</text>
      <text x="506" y="40" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#9c99c2">rendered at 3840 × 2160 px</text>
    </g>
  </g>
</svg>
